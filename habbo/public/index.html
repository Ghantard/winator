<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Pixel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="topbar" hidden>
    <button id="nav-btn" type="button">Navigateur</button>
    <button id="cat-btn" type="button">Catalogue</button>
    <button id="inv-btn" type="button">Inventaire</button>
    <span id="room-name"></span>
    <span id="credits" title="Tes credits"><span class="coin" aria-hidden="true"></span><span id="credits-value">0</span></span>
  </div>

  <div id="navigator" class="panel" hidden>
    <div class="panel-head">
      <strong>Salles</strong>
      <button class="close" data-close="navigator" type="button" aria-label="Fermer">&times;</button>
    </div>
    <ul id="room-list"></ul>
  </div>

  <div id="catalog" class="panel" hidden>
    <div class="panel-head">
      <strong>Catalogue</strong>
      <button class="close" data-close="catalog" type="button" aria-label="Fermer">&times;</button>
    </div>
    <div id="cat-tabs" class="tabs"></div>
    <div id="cat-grid" class="furni-grid"></div>
    <div id="cat-detail" class="detail">
      <canvas id="cat-preview"></canvas>
      <div class="detail-text">
        <strong id="cat-name">Choisis un mobi</strong>
        <span id="cat-price"></span>
        <button id="cat-buy" type="button" disabled>Acheter</button>
      </div>
    </div>
  </div>

  <div id="inventory" class="panel" hidden>
    <div class="panel-head">
      <strong>Inventaire</strong>
      <button class="close" data-close="inventory" type="button" aria-label="Fermer">&times;</button>
    </div>
    <p class="hint">Clique sur un mobi pour le poser dans la salle.</p>
    <div id="inv-grid" class="furni-grid"></div>
    <p id="inv-empty" class="hint">Ton inventaire est vide. Passe par le catalogue !</p>
  </div>

  <div id="furni-info" class="panel" hidden>
    <div class="panel-head">
      <strong id="info-name"></strong>
      <button class="close" data-close="furni-info" type="button" aria-label="Fermer">&times;</button>
    </div>
    <canvas id="info-preview"></canvas>
    <p id="info-owner" class="hint"></p>
    <div class="info-actions">
      <button id="info-use" type="button">Utiliser</button>
      <button id="info-rotate" type="button" class="secondary">Tourner</button>
      <button id="info-move" type="button" class="secondary">Deplacer</button>
      <button id="info-pickup" type="button" class="secondary">Ramasser</button>
    </div>
  </div>

  <div id="place-hint" hidden>Clique pour poser &middot; <kbd>R</kbd> pour tourner &middot; <kbd>Echap</kbd> pour annuler</div>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <div id="chat-log" hidden></div>

  <form id="chat-form" autocomplete="off" hidden>
    <input id="chat-input" maxlength="120" placeholder="Dis quelque chose... (Entree pour envoyer)">
  </form>

  <div id="login" class="overlay">
    <form id="login-form" class="panel login-card">
      <h1>Hotel Pixel</h1>
      <div class="editor">
        <div class="preview">
          <canvas id="preview" width="72" height="152"></canvas>
          <div class="preview-actions">
            <button type="button" id="rotate-left" aria-label="Tourner a gauche">&#8634;</button>
            <button type="button" id="rotate-right" aria-label="Tourner a droite">&#8635;</button>
          </div>
          <button type="button" id="random-look" class="secondary">Au hasard</button>
        </div>
        <div id="look-options"></div>
      </div>
      <label for="name-input">Pseudo</label>
      <input id="name-input" maxlength="16" placeholder="Ton pseudo" required autofocus>
      <button type="submit">Entrer dans l'hotel</button>
    </form>
  </div>

  <div id="disconnected" class="overlay" hidden>
    <div class="panel login-card">
      <h1>Connexion perdue</h1>
      <button type="button" onclick="location.reload()">Se reconnecter</button>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
