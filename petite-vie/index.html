<title>Pixel Hôtel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap">
<style>
/* Layout: hotel client — the room fills the screen on black; room pill, credits, chat and icon toolbar float over it; grey windows with blue headers. Single look on purpose. */
:root{
  --void:#000; --glass:rgba(22,24,28,.88); --glass-line:#000; --glass-hi:rgba(255,255,255,.12);
  --win:#ececea; --win-2:#dcdcd6; --head:#2f7aa8; --head-hi:#4c97c4; --head-lo:#1f5c82;
  --text:#191919; --muted:#5d5d58; --on-dark:#f1f1ee; --dim-dark:#a9adb3;
  --green:#3fa33f; --green-hi:#6ccc5f; --green-lo:#23701f; --gold:#f6c343; --danger:#d6453c;
  --top:calc(env(safe-area-inset-top,0px) + 8px); --bot:calc(env(safe-area-inset-bottom,0px) + 8px);
  --font:"Ubuntu", "Trebuchet MS", system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--void);color:var(--on-dark);font-family:var(--font);font-size:14px;line-height:1.3;-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{position:fixed;inset:0;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.glass{background:var(--glass);border:1px solid var(--glass-line);border-radius:8px;box-shadow:inset 0 1px 0 var(--glass-hi),0 2px 0 rgba(0,0,0,.5)}
.hbtn{color:var(--text);background:linear-gradient(#fbfbf9,#d4d4ce);border:1px solid #000;border-radius:5px;box-shadow:inset 0 1px 0 #fff;padding:0 10px;min-height:32px;font-weight:500}
.hbtn:active{background:linear-gradient(#d4d4ce,#fbfbf9)}
.hbtn.go{color:#fff;background:linear-gradient(var(--green-hi),var(--green));box-shadow:inset 0 1px 0 #9be58f;text-shadow:0 1px 0 var(--green-lo)}
.hbtn.warn{color:#fff;background:linear-gradient(#ef7a6f,var(--danger));box-shadow:inset 0 1px 0 #f7aca4}
.hbtn:disabled{opacity:.5;cursor:default}

/* Room */
#hotelView{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0}
#stage{position:absolute;inset:0;z-index:1;display:flex;overflow:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;box-sizing:border-box;
  padding:calc(var(--top) + 48px) 0 calc(var(--bot) + 112px);background:#000;transition:background .4s}
#stage::-webkit-scrollbar{display:none}
#stage.sky{background:linear-gradient(#5aa9e6,#9fd4f5 55%,#d9f0fc)}
#world{position:relative;margin:auto;flex:none}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation;transition:opacity .25s}
#bubbles{position:absolute;inset:0;pointer-events:none;z-index:3}
.bubble{position:absolute;display:flex;align-items:center;gap:5px;max-width:260px;white-space:nowrap;background:#fff;color:var(--text);border:1px solid #000;border-radius:7px;
  padding:3px 8px 3px 3px;font-size:12px;line-height:1.25;box-shadow:0 2px 0 rgba(0,0,0,.35);transition:top .25s ease-out,opacity .4s}
.bubble::after{content:"";position:absolute;left:var(--tail,50%);bottom:-5px;width:8px;height:8px;background:inherit;border-right:1px solid #000;border-bottom:1px solid #000;transform:translateX(-50%) rotate(45deg)}
.bubble img{width:22px;height:22px;image-rendering:pixelated;flex:none;object-fit:cover;object-position:top}
.bubble b{font-weight:700;margin-right:2px;white-space:nowrap}
.bubble span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.bubble.me{background:#e7f4ff}.bubble.cat{background:#fff4df}
.nametag{position:absolute;z-index:4;transform:translate(-50%,-100%);background:rgba(0,0,0,.75);color:#fff;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;pointer-events:none;white-space:nowrap}

/* Floating HUD */
.hud{position:absolute;z-index:5}
.tl{left:8px;top:var(--top);max-width:calc(100% - 140px)}
.tr{right:8px;top:var(--top);display:flex;gap:6px}
.roompill{display:flex;flex-direction:column;align-items:flex-start;text-align:left;color:var(--on-dark);padding:5px 10px;min-width:0;max-width:100%}
.roompill b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.roompill span{font-size:11px;color:var(--dim-dark)}
.coins{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border-radius:16px}
.coins img{width:20px;height:20px;image-rendering:pixelated}
.coins b{font-variant-numeric:tabular-nums;font-size:15px;color:var(--gold)}
.bottom{left:0;right:0;bottom:var(--bot);display:flex;flex-direction:column;align-items:center;gap:6px;padding-inline:8px;pointer-events:none}
.bottom > *{pointer-events:auto}
.chat{display:flex;gap:6px;width:100%;max-width:520px;box-sizing:border-box;padding:4px}
.chat input{flex:1;min-width:0;font:inherit;font-size:16px;background:#fff;color:var(--text);border:1px solid #000;border-radius:16px;padding:6px 12px;box-shadow:inset 0 1px 2px rgba(0,0,0,.25);-webkit-user-select:text;user-select:text}
.chat .hbtn{border-radius:16px}
.toolbar{display:flex;gap:3px;padding:4px;max-width:100%;box-sizing:border-box}
.tool{position:relative;display:flex;align-items:center;justify-content:center;width:42px;height:42px;padding:0;background:transparent;border:1px solid transparent;border-radius:7px;color:var(--on-dark)}
.tool:active,.tool[aria-pressed="true"]{background:rgba(255,255,255,.14);border-color:#000}
.tool[aria-pressed="true"]{background:rgba(108,204,95,.35)}
.tool img{width:32px;height:32px;image-rendering:pixelated}
.tool span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tool.me img{width:34px;height:34px;object-fit:cover;object-position:top}
.sep{width:1px;background:#3a3d42;margin:6px 2px}
#toasts{position:absolute;left:8px;right:8px;top:calc(var(--top) + 52px);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:7}
.toast{background:rgba(20,22,26,.94);color:var(--on-dark);border:1px solid #000;border-radius:8px;box-shadow:inset 0 1px 0 #3a3d42;padding:6px 12px;font-size:13px;max-width:100%;text-align:center;animation:tin .25s ease-out}
.toast.good{box-shadow:inset 0 1px 0 #3a3d42,inset 3px 0 0 var(--green)}.toast.bad{box-shadow:inset 0 1px 0 #3a3d42,inset 3px 0 0 var(--danger)}
@keyframes tin{from{transform:translateY(-6px);opacity:0}}
#menu{position:absolute;z-index:6;width:190px;background:rgba(24,26,30,.95);border:1px solid #000;border-radius:8px;box-shadow:inset 0 1px 0 #43474d,0 3px 0 rgba(0,0,0,.4);padding:3px;display:flex;flex-direction:column}
#menu h3{margin:3px 6px 2px;font-size:13px;font-weight:700;color:#fff;text-align:center}
#menu p{display:none}
.act{display:flex;align-items:center;justify-content:space-between;gap:6px;text-align:left;background:transparent;color:var(--on-dark);border:0;border-top:1px solid #34373c;padding:7px 8px;min-height:36px;border-radius:4px;font-size:13px}
.act:hover:not(:disabled),.act:active:not(:disabled){background:var(--head)}
.act:disabled{color:#7b7f86;cursor:default}
.act small{color:var(--dim-dark);font-size:11px}
#infostand{position:absolute;z-index:6;right:8px;bottom:calc(var(--bot) + 112px);width:178px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#infostand .card-i{width:100%;box-sizing:border-box;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
#infostand .card-i b{font-size:14px;color:#fff}
#infostand .card-i img{max-width:96px;max-height:96px;image-rendering:pixelated}
#infostand .card-i p{margin:0;font-size:11px;color:var(--dim-dark);font-style:italic}
#infostand .hbtn{min-height:30px;font-size:12px;border-radius:14px;padding:0 12px}
#infostand .row{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
#placebar{position:absolute;z-index:6;left:8px;right:8px;bottom:calc(var(--bot) + 112px);display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 8px}
#placebar span{flex:1;min-width:120px;font-size:12px;color:var(--dim-dark)}

/* Windows */
.hwin{background:var(--win);color:var(--text);border:1px solid #000;border-radius:8px;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.45)}
.hwin > header{background:linear-gradient(var(--head-hi),var(--head));border-bottom:1px solid var(--head-lo);color:#fff;padding:7px 10px;display:flex;align-items:center;gap:8px;box-shadow:inset 0 1px 0 #7bb7dc;text-shadow:0 1px 0 var(--head-lo)}
.hwin > header b{font-size:15px;flex:1}
.close{background:linear-gradient(#e86a5e,#c4382d);color:#fff;border:1px solid #000;border-radius:4px;width:26px;height:24px;padding:0;font-weight:700;line-height:1;box-shadow:inset 0 1px 0 #f5a097}
.hwin .body{padding:10px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 1px 0 #fff}
#sheet{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
#sheet .hwin{width:100%;max-width:520px;max-height:80vh;display:flex;flex-direction:column}
#sheet .body{overflow-y:auto;min-height:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{min-height:30px;font-size:12px;padding:0 9px}
.tabs button[aria-pressed="true"]{color:#fff;background:linear-gradient(var(--head-hi),var(--head));box-shadow:inset 0 1px 0 #7bb7dc}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.card{display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;border:1px solid #9a9a93;border-radius:6px;padding:6px 4px;color:var(--text);min-width:0}
.card[aria-pressed="true"]{border-color:var(--head);box-shadow:0 0 0 2px var(--head)}
.card img{width:72px;height:64px;image-rendering:pixelated;object-fit:contain}
.card b{font-size:12px;font-weight:500;text-align:center;line-height:1.15}
.card small{font-size:12px;color:#8a6a10;font-weight:700;display:flex;align-items:center;gap:3px}
.card small img{width:14px;height:14px}
.hc{background:#f6c343;color:#3a2a00;border:1px solid #000;border-radius:3px;padding:0 3px;font-size:10px;font-weight:700}
.detail{display:flex;gap:10px;align-items:center;background:var(--win-2);border:1px solid #9a9a93;border-radius:6px;padding:8px}
.detail img{width:72px;height:64px;image-rendering:pixelated;object-fit:contain;flex:none}
.detail div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.detail p{margin:0;font-size:12px;color:var(--muted)}
.rooms{display:flex;flex-direction:column;gap:6px}
.room{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #9a9a93;border-radius:6px;padding:8px 10px;text-align:left;color:var(--text)}
.room .dot{width:34px;height:34px;border-radius:6px;border:1px solid #000;flex:none}
.room div{flex:1;min-width:0}.room b{display:block;font-size:14px}.room span{font-size:12px;color:var(--muted)}
.room em{font-style:normal;font-size:12px;font-weight:700;color:#fff;background:var(--green);border:1px solid #000;border-radius:10px;padding:1px 8px}
.room em.empty{background:#9a9a93}
.maker{display:flex;gap:12px;align-items:flex-start}
.previewbox{flex:none;width:96px;height:186px;background:radial-gradient(ellipse at 50% 88%,#c9c9c2 0 30%,transparent 31%),linear-gradient(#f7f7f4,#dcdcd6);border:1px solid #000;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;box-sizing:border-box}
.previewbox canvas{width:78px;height:171px;image-rendering:pixelated}
.fields{display:flex;flex-direction:column;gap:7px;flex:1;min-width:0}
.fields label,.fields .lbl{font-size:12px;color:var(--muted);font-weight:500;display:flex;flex-direction:column;gap:3px}
.txt{font:inherit;font-size:16px;background:#fff;color:var(--text);border:1px solid #000;border-radius:5px;padding:5px 7px;width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text;box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.sw{display:flex;gap:5px;flex-wrap:wrap}
.sw button{width:24px;height:24px;border:1px solid #000;border-radius:50%;padding:0;box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.sw button[aria-pressed="true"]{outline:2px solid var(--head);outline-offset:2px}
.seg{display:flex;gap:4px}
.seg button{flex:1;min-height:28px;font-size:12px;padding:0 4px}
.seg button[aria-pressed="true"]{color:#fff;background:linear-gradient(var(--head-hi),var(--head));box-shadow:inset 0 1px 0 #7bb7dc}
.big{min-height:44px;width:100%;font-size:15px;font-weight:700}
.logo{margin:0;font-size:30px;font-weight:700;letter-spacing:-.01em;color:var(--text);line-height:1}
.logo i{font-style:normal;color:var(--head)}
.tag{margin:0;color:var(--muted);font-size:13px}
.help{font-size:12.5px;color:var(--muted);margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.help b{color:var(--text)}
.muted{font-size:12px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){.toast{animation-duration:.01s}.bubble{transition:none}}
</style>

<div id="app">
  <canvas id="hotelView" aria-label="Vue de l'hôtel"></canvas>
  <div id="stage"><div id="world">
    <canvas id="game" aria-label="La pièce"></canvas>
    <div id="bubbles"></div>
    <div id="menu" hidden></div>
  </div></div>
  <div class="hud tl"><button class="glass roompill" id="roomPill"><b id="roomLbl">Pixel Hôtel</b><span id="roomSub">Vue de l'hôtel</span></button></div>
  <div class="hud tr"><div class="glass coins" title="Crédits"><img id="coinImg" alt=""><b id="moneyLbl">0</b></div></div>
  <div id="toasts"></div>
  <aside id="infostand" hidden></aside>
  <div id="placebar" class="glass" hidden><span id="placeTxt">Touche une case pour placer le mobi.</span>
    <button class="hbtn" id="placeRot">Tourner</button><button class="hbtn go" id="placeOk">Poser</button><button class="hbtn" id="placeNo">Annuler</button></div>
  <div class="hud bottom">
    <form class="glass chat" id="chatForm" autocomplete="off">
      <input id="chatInput" maxlength="90" placeholder="Écris un message…" enterkeyhint="send">
      <button class="hbtn go" type="submit">Envoyer</button>
    </form>
    <nav class="glass toolbar" aria-label="Menu de l'hôtel">
      <button class="tool" id="tHotel"><img alt="" data-icon="hotel"><span>Vue de l'hôtel</span></button>
      <button class="tool" id="tNav"><img alt="" data-icon="nav"><span>Navigateur</span></button>
      <button class="tool" id="tCat"><img alt="" data-icon="cat"><span>Catalogue</span></button>
      <button class="tool" id="tInv"><img alt="" data-icon="inv"><span>Inventaire</span></button>
      <i class="sep"></i>
      <button class="tool" id="tZoom"><img alt="" data-icon="zoom"><span>Zoom</span></button>
      <button class="tool" id="tDance" aria-pressed="false"><img alt="" data-icon="dance"><span>Danser</span></button>
      <button class="tool" id="tWave"><img alt="" data-icon="wave"><span>Coucou</span></button>
      <button class="tool me" id="tWar"><img alt="" id="meIcon" data-icon="war"><span>Mon perso</span></button>
    </nav>
  </div>
</div>

<div id="sheet" hidden><section class="hwin"><header><b id="sheetTitle">Navigateur</b><button class="close" id="sheetClose" aria-label="Fermer">×</button></header><div class="body" id="sheetBody"></div></section></div>

<script>
(() => {
'use strict';
/* ================= Isometric space ================= */
let GX = 8, GY = 8, WALLH = 62, OX = 0, OY = 0, CW = 0, CH = 0;
const SLAB = 6;
const P = (x, y, z = 0) => [OX + (x - y)*16, OY + (x + y)*8 - z];

/* ================= Pixel primitives ================= */
let C = null;
const fr = (x, y, w, h, col) => { C.fillStyle = col; C.fillRect(Math.round(x), Math.round(y), w, h); };
function poly(pts, col) {
  C.fillStyle = col; let y0 = Infinity, y1 = -Infinity;
  for (const p of pts) { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
  for (let y = Math.floor(y0); y < Math.ceil(y1); y++) { const yc = y + .5, xs = [];
    for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i+1) % pts.length];
      if ((a[1] <= yc && b[1] > yc) || (b[1] <= yc && a[1] > yc)) xs.push(a[0] + (yc - a[1])*(b[0] - a[0])/(b[1] - a[1])); }
    xs.sort((p, q) => p - q);
    for (let i = 0; i + 1 < xs.length; i += 2) { const a = Math.round(xs[i]), b = Math.round(xs[i+1]); if (b > a) C.fillRect(a, y, b - a, 1); } }
}
function line(a, b, col) {
  let x0 = Math.round(a[0]), y0 = Math.round(a[1]); const x1 = Math.round(b[0]), y1 = Math.round(b[1]);
  const dx = Math.abs(x1-x0), dy = -Math.abs(y1-y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy;
  C.fillStyle = col;
  for (let n = 0; n < 3000; n++) { C.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2*e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255];
  const m = v => Math.max(0, Math.min(255, Math.round(f > 1 ? v + (255 - v)*(f - 1) : v*f)));
  return `rgb(${m(c[0])},${m(c[1])},${m(c[2])})`;
}
function box(x, y, w, d, z, h, base) {
  const A = P(x,y,z+h), B = P(x+w,y,z+h), Cc = P(x+w,y+d,z+h), D = P(x,y+d,z+h), Cb = P(x+w,y+d,z), Bb = P(x+w,y,z), Db = P(x,y+d,z);
  if (h > 0) { poly([D,Cc,Cb,Db], shade(base,.84)); poly([Cc,B,Bb,Cb], shade(base,.68)); }

const faceY = (x0, x1, y, z0, z1, col) => poly([P(x0,y,z0),P(x1,y,z0),P(x1,y,z1),P(x0,y,z1)], col);
const faceX = (x, y0, y1, z0, z1, col) => poly([P(x,y0,z0),P(x,y1,z0),P(x,y1,z1),P(x,y0,z1)], col);
const topQ = (x0, y0, x1, y1, z, col) => poly([P(x0,y0,z),P(x1,y0,z),P(x1,y1,z),P(x0,y1,z)], col);
function disc(cx, cy, r, col) { C.fillStyle = col; for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r*r - dy*dy) + .3); C.fillRect(Math.round(cx) - w, Math.round(cy) + dy, 2*w + 1, 1); } }
function ell(cx, cy, rx, ry, col) { C.fillStyle = col; for (let dy = -ry; dy <= ry; dy++) { const w = Math.round(rx*Math.sqrt(Math.max(0, 1 - (dy*dy)/(ry*ry + .01)))); C.fillRect(Math.round(cx) - w, Math.round(cy) + dy, 2*w + 1, 1); } }
function outlinePass(c, col) {
  const x = c.getContext('2d'), im = x.getImageData(0, 0, c.width, c.height), d = im.data, W = c.width, H = c.height;
  const src = new Uint8Array(W*H); for (let i = 0; i < W*H; i++) src[i] = d[i*4+3] > 60 ? 1 : 0;
  const fixed = col && col !== 'auto' ? [parseInt(col.slice(1,3),16), parseInt(col.slice(3,5),16), parseInt(col.slice(5,7),16)] : null;
  for (let yy = 0; yy < H; yy++) for (let xx = 0; xx < W; xx++) { const i = yy*W + xx; if (src[i]) continue;
    const nb = (xx > 0 && src[i-1]) ? i-1 : (xx < W-1 && src[i+1]) ? i+1 : (yy > 0 && src[i-W]) ? i-W : (yy < H-1 && src[i+W]) ? i+W : -1;
    if (nb < 0) continue;
    if (fixed) { d[i*4] = fixed[0]; d[i*4+1] = fixed[1]; d[i*4+2] = fixed[2]; }
    else { d[i*4] = d[nb*4]*.38 | 0; d[i*4+1] = d[nb*4+1]*.34 | 0; d[i*4+2] = d[nb*4+2]*.36 | 0; }
    d[i*4+3] = 255; }
  x.putImageData(im, 0, 0);
}
const darkOf = hex => { const n = parseInt(hex.slice(1), 16); return `rgb(${((n >> 16)*.38) | 0},${(((n >> 8) & 255)*.34) | 0},${((n & 255)*.36) | 0})`; };
function pix(rows, pal, scale = 1, outline) {

function lookEditor(body, look, onChange) {
  const maker = document.createElement('div'); maker.className = 'maker';
  maker.innerHTML = `<div class="previewbox"><canvas width="26" height="57"></canvas></div><div class="fields"></div>`;
  body.appendChild(maker);
  const cvp = maker.querySelector('canvas'), fields = maker.querySelector('.fields');
  const draw = () => { const x = cvp.getContext('2d'); x.clearRect(0, 0, 26, 57); x.drawImage(avatarSet(look).get('front','stand','wave'), 0, 0); onChange && onChange(); };
  const seg = (label, opts, key) => { const d = document.createElement('div'); d.className = 'lbl'; d.textContent = label; const s = document.createElement('div'); s.className = 'seg'; d.appendChild(s);
    const paint = () => { s.innerHTML = ''; opts.forEach((o, i) => { const b = document.createElement('button'); b.className = 'hbtn'; b.textContent = o; b.setAttribute('aria-pressed', String(look[key] === i)); b.onclick = () => { look[key] = i; paint(); draw(); }; s.appendChild(b); }); };
    paint(); fields.appendChild(d); };
  const sw = (label, list, key) => { const d = document.createElement('div'); d.className = 'lbl'; d.textContent = label; const s = document.createElement('div'); s.className = 'sw'; d.appendChild(s);
    const paint = () => { s.innerHTML = ''; list.forEach((c, i) => { const b = document.createElement('button'); b.style.background = c[0]; b.setAttribute('aria-label', label + ' ' + (i+1)); b.setAttribute('aria-pressed', String(look[key] === i)); b.onclick = () => { look[key] = i; paint(); draw(); }; s.appendChild(b); }); };
    paint(); fields.appendChild(d); };
  seg('Coiffure', STYLES, 'style'); sw('Cheveux', HAIRS, 'hair'); sw('Peau', SKINS, 'skin'); sw('Haut', SHIRTS, 'shirt'); sw('Pantalon', PANTS, 'pants');
  draw();
}
function openWardrobe() {
  const b = openSheet('Garde-robe'); const look = Object.assign({}, S.look);
  lookEditor(b, look);
  const lm = document.createElement('label'); lm.className = 'muted'; lm.style.display = 'flex'; lm.style.flexDirection = 'column'; lm.style.gap = '3px'; lm.textContent = 'Devise';
  const inp = document.createElement('input'); inp.className = 'txt'; inp.maxLength = 40; inp.value = S.motto; lm.appendChild(inp); b.appendChild(lm);
  const ok = document.createElement('button'); ok.className = 'hbtn go big'; ok.textContent = 'Enregistrer mon look'; b.appendChild(ok);
  ok.onclick = () => { S.look = look; S.motto = inp.value.trim() || S.motto; save(); if (!R) { closeSheet(); return; } R.me.look = look; R.me.av = avatarSet(look); R.me.motto = S.motto; $('meIcon').src = R.me.av.faceUrl; save(); closeSheet(); R.me.wave = 2;
    if (R.ents.some(e => e.bot)) setTimeout(() => { const bt = R.ents.find(e => e.bot); if (bt) say(bt, pickRand(['Trop stylé ton nouveau look !','Oh, ça te va bien !'])); }, 900); };
}
function openWelcome() {
  const b = openSheet('Bienvenue'); $('sheetClose').hidden = true; showHotelView();
  const saved = loadSave();
  b.insertAdjacentHTML('beforeend', `<h1 class="logo">Pixel <i>Hôtel</i></h1><p class="tag">Un hôtel en pixels, rien que pour toi. Crée ton perso et entre !</p>`);
  const look = saved ? Object.assign({}, saved.look) : {style:0, hair:0, skin:0, shirt:2, pants:0};
  const nameL = document.createElement('label'); nameL.className = 'muted'; nameL.style.display = 'flex'; nameL.style.flexDirection = 'column'; nameL.style.gap = '3px'; nameL.textContent = 'Pseudo';
  const nameI = document.createElement('input'); nameI.className = 'txt'; nameI.maxLength = 14; nameI.value = saved ? saved.name : 'Pixelou'; nameL.appendChild(nameI);
  b.appendChild(nameL); lookEditor(b, look);
  if (saved) { const c = document.createElement('button'); c.className = 'hbtn go big'; c.textContent = `Continuer en tant que ${saved.name}`; c.onclick = () => { $('sheetClose').hidden = false; closeSheet(); boot(saved); }; b.appendChild(c); }
  const n = document.createElement('button'); n.className = 'hbtn big' + (saved ? '' : ' go'); n.textContent = saved ? 'Nouveau perso' : 'Entrer dans l\'hôtel'; b.appendChild(n);
  let armed = false;
  n.onclick = () => { if (saved && !armed) { armed = true; n.textContent = 'Effacer l\'ancien perso ?'; n.classList.add('warn'); return; }
    const name = nameI.value.trim().slice(0, 14) || 'Pixelou'; $('sheetClose').hidden = false; closeSheet(); boot(newProfile(name, look, 'Nouveau·elle à l\'hôtel !')); };
  b.insertAdjacentHTML('beforeend', `<ul class="help"><li><b>Touche le sol</b> pour marcher, <b>un mobi</b> pour t'asseoir ou l'utiliser.</li><li><b>Écris dans le chat</b> : les autres te répondent. Au Café, dis « café » au serveur !</li><li><b>Navigateur</b> pour changer de pièce, <b>Catalogue</b> pour acheter des mobis.</li><li>Décore <b>ton appart</b> : déplace, tourne et range tes mobis.</li></ul>`);
}
$('tNav').onclick = () => openNavigator();
$('roomPill').onclick = () => openNavigator();
$('tHotel').onclick = () => { if (R) showHotelView(); openNavigator(); };
$('tZoom').onclick = () => { if (!R) return; zoomLvl = (zoomLvl + 1) % 3; layout(); centerOn(R.me, false); };
$('tCat').onclick = () => openCatalogue();
$('tInv').onclick = () => openInventory();
$('tWar').onclick = () => openWardrobe();
$('tDance').onclick = () => { if (!R) return; dancingMe = !dancingMe; R.me.pose = null; syncDance(); };
$('tWave').onclick = () => { if (!R) return; R.me.wave = 2; };
$('chatForm').addEventListener('submit', ev => {
  ev.preventDefault(); if (!R) return; const inp = $('chatInput'), text = inp.value.trim(); if (!text) return; inp.value = '';
  const low = norm(text);
  if (low === ':danse' || low === '/danse') { dancingMe = true; R.me.pose = null; syncDance(); return; }
  if (low === ':coucou' || low === '/coucou') { R.me.wave = 2; return; }
  say(R.me, text);
  const d = drinkFromText(low);
  if (d && staff('waiter')) { order(R.me, d); return; }
  if (staff('reception') && (/chambre|cle|appart|aide|info|bonjour|salut|coucou|sofia/.test(low))) { receptionReply(low); if (!/salut|coucou|bonjour/.test(low)) return; }
  botReply(text);
});

/* ================= Boot & loop ================= */
function boot(profile) {
  S = profile;
  const today = new Date().toISOString().slice(0, 10);
  if (S.lastDaily !== today) { const first = !S.lastDaily; S.lastDaily = today; if (!first) { S.credits += 50; setTimeout(() => toast('Bonus du jour : +50 crédits !', 'good'), 800); } }
  renderCredits(); enterRoom(ROOMS[S.room] ? S.room : 'reception', false);
  save();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
let last = performance.now(), followT = 0;
function frame(now) {
  const dt = Math.min(.1, (now - last)/1000); last = now;
  if (R && S) { update(dt); followT -= dt; if (followT < 0 && R.me.moving) { followT = .4; const [sx] = P(R.me.x, R.me.y), x = world.offsetLeft + sx*scale - stage.scrollLeft;
    if (x < stage.clientWidth*.22 || x > stage.clientWidth*.78) centerOn(R.me, true); } }
  render(now/1000);
  requestAnimationFrame(frame);
}
function start(data) {
  const st = data && data.state;
  if (st && st.v === 1) boot(st); else openWelcome();
  if (!R) drawHotelView();
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => (S ? {state:S} : {}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
