<title>Pixel Hôtel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap">
<style>
/* Layout: hotel client — room bar, isometric room floating on black, chat bar, dark toolbar, grey windows with blue headers. Single look on purpose. */
:root{
  --void:#07090c; --bar:#1d1f22; --bar-hi:#2c2f33;
  --win:#ececea; --win-2:#dcdcd6; --head:#2f7aa8; --head-hi:#4c97c4; --head-lo:#1f5c82;
  --text:#191919; --muted:#5d5d58; --on-dark:#f1f1ee; --dim-dark:#a9adb3;
  --green:#3fa33f; --green-hi:#6ccc5f; --green-lo:#23701f; --gold:#f6c343; --danger:#d6453c;
  --font:"Ubuntu", "Trebuchet MS", system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--void);color:var(--on-dark);font-family:var(--font);font-size:14px;line-height:1.3;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#app{max-width:560px;height:100%;margin:0 auto;padding-inline:16px;padding-block:8px 10px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box;-webkit-user-select:none;user-select:none}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.bar{background:var(--bar);border:1px solid #000;border-radius:8px;box-shadow:inset 0 1px 0 var(--bar-hi);display:flex;align-items:center;gap:8px;padding:6px 8px}
.roomname{display:flex;flex-direction:column;min-width:0;flex:1}
.roomname b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roomname span{font-size:12px;color:var(--dim-dark)}
.coins{display:flex;align-items:center;gap:6px;background:#111;border:1px solid #000;border-radius:14px;padding:3px 10px 3px 4px}
.coins img{width:20px;height:20px;image-rendering:pixelated}
.coins b{font-variant-numeric:tabular-nums;font-size:15px;color:var(--gold)}
.hbtn{color:var(--text);background:linear-gradient(#fbfbf9,#d4d4ce);border:1px solid #000;border-radius:5px;box-shadow:inset 0 1px 0 #fff;padding:0 10px;min-height:32px;font-weight:500}
.hbtn:active{background:linear-gradient(#d4d4ce,#fbfbf9)}
.hbtn.go{color:#fff;background:linear-gradient(var(--green-hi),var(--green));box-shadow:inset 0 1px 0 #9be58f;text-shadow:0 1px 0 var(--green-lo)}
.hbtn.warn{color:#fff;background:linear-gradient(#ef7a6f,var(--danger));box-shadow:inset 0 1px 0 #f7aca4}
.hbtn:disabled{opacity:.5;cursor:default}

/* Stage */
#stageWrap{position:relative;flex:1;min-height:220px;display:flex;margin-inline:-16px}
#stage{position:relative;flex:1;min-width:0;display:flex;overflow:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;background:radial-gradient(ellipse at 50% 40%,#161b22 0%,var(--void) 70%);transition:background .4s}
#stage::-webkit-scrollbar{display:none}
#world{position:relative;margin:auto;flex:none}
#stage.sky{background:linear-gradient(#7cc6f2,#bfe6fb 70%,#e9f7ff)}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation;transition:opacity .25s}
#bubbles{position:absolute;inset:0;pointer-events:none;z-index:3}
.bubble{position:absolute;display:flex;align-items:center;gap:5px;max-width:260px;white-space:nowrap;background:#fff;color:var(--text);border:1px solid #000;border-radius:7px;
  padding:3px 8px 3px 3px;font-size:12px;line-height:1.25;box-shadow:0 2px 0 rgba(0,0,0,.35);transition:top .25s ease-out,opacity .4s}
.bubble::after{content:"";position:absolute;left:var(--tail,50%);bottom:-5px;width:8px;height:8px;background:inherit;border-right:1px solid #000;border-bottom:1px solid #000;transform:translateX(-50%) rotate(45deg)}
.bubble img{width:22px;height:22px;image-rendering:pixelated;flex:none;object-fit:cover;object-position:top}
.bubble b{font-weight:700;margin-right:2px;white-space:nowrap}
.bubble span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.bubble.me{background:#e7f4ff}.bubble.cat{background:#fff4df}
#toasts{position:absolute;left:8px;right:8px;top:8px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:7}
.toast{background:rgba(20,22,26,.94);color:var(--on-dark);border:1px solid #000;border-radius:8px;box-shadow:inset 0 1px 0 #3a3d42;padding:6px 12px;font-size:13px;max-width:100%;text-align:center;animation:tin .25s ease-out}
.toast.good{box-shadow:inset 0 1px 0 #3a3d42,inset 3px 0 0 var(--green)}.toast.bad{box-shadow:inset 0 1px 0 #3a3d42,inset 3px 0 0 var(--danger)}
@keyframes tin{from{transform:translateY(-6px);opacity:0}}
#menu{position:absolute;z-index:6;width:220px;background:rgba(24,26,30,.96);border:1px solid #000;border-radius:8px;box-shadow:inset 0 1px 0 #43474d,0 3px 0 rgba(0,0,0,.4);padding:4px;display:flex;flex-direction:column}
#menu h3{margin:3px 6px 0;font-size:14px;font-weight:700;color:#fff}
#menu p{margin:1px 6px 5px;font-size:12px;color:var(--dim-dark);font-style:italic}
.act{display:flex;align-items:center;justify-content:space-between;gap:6px;text-align:left;background:transparent;color:var(--on-dark);border:0;border-top:1px solid #34373c;padding:8px 6px;min-height:38px;border-radius:4px;font-size:14px}
.act:hover:not(:disabled),.act:active:not(:disabled){background:var(--head)}
.act:disabled{color:#7b7f86;cursor:default}
.act small{color:var(--dim-dark);font-size:11px}
#placebar{flex-wrap:wrap}
#placebar span{flex:1;min-width:120px;font-size:12px;color:var(--dim-dark)}

/* Chat + toolbar */
.chat{display:flex;gap:6px;padding:5px}
.chat input{flex:1;min-width:0;font:inherit;font-size:16px;background:#fff;color:var(--text);border:1px solid #000;border-radius:16px;padding:6px 12px;box-shadow:inset 0 1px 2px rgba(0,0,0,.25);-webkit-user-select:text;user-select:text}
.chat .hbtn{border-radius:16px}
.toolbar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:5px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;background:linear-gradient(#3a3d42,#26282c);color:var(--on-dark);border:1px solid #000;border-radius:6px;box-shadow:inset 0 1px 0 #50545a;padding:5px 2px;font-size:11px;min-width:0}
.tool img{width:24px;height:24px;image-rendering:pixelated}
.tool[aria-pressed="true"]{background:linear-gradient(var(--green-hi),var(--green));box-shadow:inset 0 1px 0 #9be58f;color:#fff}
.tool span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* Windows */
.hwin{background:var(--win);color:var(--text);border:1px solid #000;border-radius:8px;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.45)}
.hwin > header{background:linear-gradient(var(--head-hi),var(--head));border-bottom:1px solid var(--head-lo);color:#fff;padding:7px 10px;display:flex;align-items:center;gap:8px;box-shadow:inset 0 1px 0 #7bb7dc;text-shadow:0 1px 0 var(--head-lo)}
.hwin > header b{font-size:15px;flex:1}
.close{background:linear-gradient(#e86a5e,#c4382d);color:#fff;border:1px solid #000;border-radius:4px;width:26px;height:24px;padding:0;font-weight:700;line-height:1;box-shadow:inset 0 1px 0 #f5a097}
.hwin .body{padding:10px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 1px 0 #fff}
#sheet{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
#sheet .hwin{width:100%;max-width:520px;max-height:78vh;display:flex;flex-direction:column}
#sheet .body{overflow-y:auto;min-height:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{min-height:30px;font-size:12px;padding:0 9px}
.tabs button[aria-pressed="true"]{color:#fff;background:linear-gradient(var(--head-hi),var(--head));box-shadow:inset 0 1px 0 #7bb7dc}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.card{display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;border:1px solid #9a9a93;border-radius:6px;padding:6px 4px;color:var(--text);min-width:0}
.card[aria-pressed="true"]{border-color:var(--head);box-shadow:0 0 0 2px var(--head)}
.card img{width:72px;height:64px;image-rendering:pixelated;object-fit:contain}
.card b{font-size:12px;font-weight:500;text-align:center;line-height:1.15}
.card small{font-size:12px;color:#8a6a10;font-weight:700;display:flex;align-items:center;gap:3px}
.card small img{width:14px;height:14px}
.detail{display:flex;gap:10px;align-items:center;background:var(--win-2);border:1px solid #9a9a93;border-radius:6px;padding:8px}
.detail img{width:72px;height:64px;image-rendering:pixelated;object-fit:contain;flex:none}
.detail div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.detail p{margin:0;font-size:12px;color:var(--muted)}
.rooms{display:flex;flex-direction:column;gap:6px}
.room{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #9a9a93;border-radius:6px;padding:8px 10px;text-align:left;color:var(--text)}
.room .dot{width:34px;height:34px;border-radius:6px;border:1px solid #000;flex:none}
.room div{flex:1;min-width:0}.room b{display:block;font-size:14px}.room span{font-size:12px;color:var(--muted)}
.room em{font-style:normal;font-size:12px;font-weight:700;color:#fff;background:var(--green);border:1px solid #000;border-radius:10px;padding:1px 8px}
.room em.empty{background:#9a9a93}
.maker{display:flex;gap:12px;align-items:flex-start}
.previewbox{flex:none;width:84px;height:150px;background:radial-gradient(ellipse at 50% 88%,#c9c9c2 0 30%,transparent 31%),linear-gradient(#f7f7f4,#dcdcd6);border:1px solid #000;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;box-sizing:border-box}
.previewbox canvas{width:66px;height:138px;image-rendering:pixelated}
.fields{display:flex;flex-direction:column;gap:7px;flex:1;min-width:0}
.fields label,.fields .lbl{font-size:12px;color:var(--muted);font-weight:500;display:flex;flex-direction:column;gap:3px}
.txt{font:inherit;font-size:16px;background:#fff;color:var(--text);border:1px solid #000;border-radius:5px;padding:5px 7px;width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text;box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.sw{display:flex;gap:5px;flex-wrap:wrap}
.sw button{width:24px;height:24px;border:1px solid #000;border-radius:50%;padding:0;box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.sw button[aria-pressed="true"]{outline:2px solid var(--head);outline-offset:2px}
.seg{display:flex;gap:4px}
.seg button{flex:1;min-height:28px;font-size:12px;padding:0 4px}
.seg button[aria-pressed="true"]{color:#fff;background:linear-gradient(var(--head-hi),var(--head));box-shadow:inset 0 1px 0 #7bb7dc}
.big{min-height:44px;width:100%;font-size:15px;font-weight:700}
.logo{margin:0;font-size:30px;font-weight:700;letter-spacing:-.01em;color:var(--text);line-height:1}
.logo i{font-style:normal;color:var(--head)}
.tag{margin:0;color:var(--muted);font-size:13px}
.help{font-size:12.5px;color:var(--muted);margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.help b{color:var(--text)}
.muted{font-size:12px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){.toast{animation-duration:.01s}.bubble{transition:none}}
</style>

<div id="app">
  <header class="bar">
    <div class="roomname"><b id="roomLbl">Hall de l'hôtel</b><span id="roomSub">5 personnes ici</span></div>
    <div class="coins" title="Crédits"><img id="coinImg" alt=""><b id="moneyLbl">100</b></div>
  </header>
  <div id="stageWrap">
    <div id="stage"><div id="world">
      <canvas id="game" aria-label="La pièce"></canvas>
      <div id="bubbles"></div>
      <div id="menu" hidden></div>
    </div></div>
    <div id="toasts"></div>
  </div>
  <div id="placebar" class="bar" hidden><span id="placeTxt">Touche une case pour placer le mobi.</span>
    <button class="hbtn" id="placeRot">Tourner</button><button class="hbtn go" id="placeOk">Poser</button><button class="hbtn" id="placeNo">Annuler</button></div>
  <form class="bar chat" id="chatForm" autocomplete="off">
    <input id="chatInput" maxlength="90" placeholder="Écris un message…" enterkeyhint="send">
    <button class="hbtn go" type="submit">Envoyer</button>
  </form>
  <nav class="bar toolbar" aria-label="Menu de l'hôtel">
    <button class="tool" id="tNav"><img alt="" data-icon="nav"><span>Navigateur</span></button>
    <button class="tool" id="tCat"><img alt="" data-icon="cat"><span>Catalogue</span></button>
    <button class="tool" id="tInv"><img alt="" data-icon="inv"><span>Inventaire</span></button>
    <button class="tool" id="tWar"><img alt="" data-icon="war"><span>Garde-robe</span></button>
    <button class="tool" id="tDance" aria-pressed="false"><img alt="" data-icon="dance"><span>Danser</span></button>
    <button class="tool" id="tWave"><img alt="" data-icon="wave"><span>Coucou</span></button>
  </nav>
</div>

<div id="sheet" hidden><section class="hwin"><header><b id="sheetTitle">Navigateur</b><button class="close" id="sheetClose" aria-label="Fermer">×</button></header><div class="body" id="sheetBody"></div></section></div>

<script>
(() => {
'use strict';
/* ================= Isometric space ================= */

function line(a, b, col) {

  const me = R.me, near = bots.slice().sort((a, b) => (Math.abs(a.x-me.x)+Math.abs(a.y-me.y)) - (Math.abs(b.x-me.x)+Math.abs(b.y-me.y)))[0];
  const who = bots.find(b => n.includes(norm(b.name))) || near;
  let rep = null;
  if (/\b(salut|bonjour|coucou|hello|hey|yo|slt|bjr|cc|bonsoir)\b/.test(n)) { rep = pickRand([`Salut ${S.name} !`, `Coucou ${S.name} !`, 'Hey ! Bienvenue !']); who.wave = 1.8; }
  else if (/ca va|cv\b|comment tu vas|la forme/.test(n)) rep = pickRand(['Ça va bien et toi ?','Super, merci !','Tranquille, et toi ?']);
  else if (/dans/.test(n)) { rep = pickRand(['Allez, on danse !','Musique, maestro !','Je suis chaud·e !']); for (const b of bots) if (Math.random() < .7 && !b.path.length) { b.pose = null; b.dance = 10 + Math.random()*6; b.timer = b.dance; } }
  else if (/\bami|pote|friend/.test(n)) rep = 'Avec plaisir, on est potes maintenant !';
  else if (/mdr|lol|ptdr|haha|xd/.test(n)) rep = pickRand(['Mdr','Haha trop drôle','Ptdr']);
  else if (/bye|au revoir|a plus|ciao|bonne nuit|a\+/.test(n)) rep = pickRand(['À plus !','Bye !','Reviens vite !']);
  else if (/merci/.test(n)) rep = pickRand(['De rien !','Avec plaisir !']);
  else if (/\?\s*$/.test(text)) rep = pickRand(['Bonne question !','Aucune idée…','Je crois que oui.','Hmm, peut-être !','Demande au café !']);
  else if (Math.random() < .45) rep = pickRand(['Carrément !','Trop bien.','Ah ouais ?','Grave !','Stylé !','J\'avoue.']);
  if (rep) setTimeout(() => { if (!R || !R.ents.includes(who)) return; turnTo(who, R.me); say(who, rep); }, 700 + Math.random()*1300);
}

/* ================= Update loop ================= */
let bonusT = 0;
function update(dt) {
  for (const e of R.ents) {
    if (e.path.length || !atRest(e)) { stepMove(e, (e.bot ? 2.2 : 2.6) * dt); if (atRest(e)) arrive(e); } else e.moving = false;
    if (e.dance > 0 && e.bot) e.dance -= dt;
    if (e.wave > 0) e.wave -= dt;

  if (R.cat) updateCat(dt);
  if (R.room.bots) { R.spawnT -= dt; if (R.spawnT < 0) { R.spawnT = 20 + Math.random()*30; if (R.ents.filter(e => e.bot).length < R.room.bots + 1) spawnBot(true); } }
  bonusT += dt; S.played += dt;

}
function updateCat(dt) {
  const c = R.cat; if (!atRest(c)) { stepMove(c, 1.3*dt); return; }

  if (Math.random() < .3) { c.sleep = 1; c.wait = 8 + Math.random()*12; return; }
  c.sleep = 0; const t = pickRand(freeTiles()); const p = t && bfs(c.tile, t); if (p && p.length < 8) c.path = p; c.wait = 2 + Math.random()*5;

}

  const p = placing; if (p.x == null) { p.ok = false; $('placeOk').disabled = true; $('placeTxt').textContent = `${F[p.t].name} : touche une case pour le placer.`; return; }
  const it = {t:p.t, x:p.x, y:p.y, r:p.r}, rug = F[p.t].kind === 'rug';
  p.ok = footprint(it).every(([x,y]) => inRoom(x,y) && !(x === 0 && y === R.room.door) && !(x === 1 && y === R.room.door) &&
    !R.items.some(o => o !== p.item && (F[o.t].kind === 'rug') === rug && footprint(o).some(([a,b]) => a === x && b === y)));
  $('placeOk').disabled = !p.ok;
  $('placeTxt').textContent = p.ok ? `${F[p.t].name} : tu peux le poser ici.` : `${F[p.t].name} : touche une case libre.`;
}
function startPlace(type, item) {
  closeSheet();
  if (R.id !== 'home') { enterRoom('home', true); item = null; }
  placing = {t:type, item, r:item ? item.r : 0, x:item ? item.x : null, y:item ? item.y : null, ok:false};
  $('placebar').hidden = false; checkPlace(); requestAnimationFrame(layout);
}
function rotateItem(it) {
  const old = it.r; let ok = false;
  for (let i = 1; i <= 4 && !ok; i++) { it.r = (old + i) % 4; const fp = footprint(it);
    ok = fp.every(([x,y]) => inRoom(x,y) && !(x <= 1 && y === R.room.door) && !R.items.some(o => o !== it && (F[o.t].kind === 'rug') === (F[it.t].kind === 'rug') && footprint(o).some(([a,b]) => a === x && b === y))); }
  if (!ok) it.r = old; rebuildGrid(); save();
}
function pickUp(it) {
  if (R.ents.some(e => e.pose && e.pose.item === it)) return toast('Quelqu\'un utilise ce mobi.', 'bad');
  S.home.splice(S.home.indexOf(it), 1); S.inv[it.t] = (S.inv[it.t] || 0) + 1; rebuildGrid(); save(); toast(`${F[it.t].name} rangé dans l'inventaire.`, 'good');
}
$('placeRot').onclick = () => { placing.r = (placing.r + 1) % 4; checkPlace(); };
$('placeNo').onclick = () => { placing = null; $('placebar').hidden = true; requestAnimationFrame(layout); };
$('placeOk').onclick = () => {
  const p = placing; if (!p || !p.ok) return;
  if (p.item) { p.item.x = p.x; p.item.y = p.y; p.item.r = p.r; }
  else { S.inv[p.t]--; if (!S.inv[p.t]) delete S.inv[p.t]; S.home.push({t:p.t, x:p.x, y:p.y, r:p.r, on:true}); }
  R.items = S.home; rebuildGrid(); placing = null; $('placebar').hidden = true; requestAnimationFrame(layout);
  for (const e of R.ents) if (R.block.has(e.tile[1]*GX + e.tile[0])) { const t = pickRand(freeTiles()); e.tile = t.slice(); e.x = t[0]+.5; e.y = t[1]+.5; e.path = []; }
  save(); toast('Mobi posé !', 'good');
};

/* ================= Sheets: navigator, catalogue, inventory, wardrobe ================= */
function openSheet(title) { closeMenu(); $('sheetTitle').textContent = title; $('sheetBody').innerHTML = ''; $('sheet').hidden = false; return $('sheetBody'); }
function closeSheet() { $('sheet').hidden = true; }
$('sheetClose').onclick = closeSheet;
$('sheet').addEventListener('pointerdown', e => { if (e.target === $('sheet')) closeSheet(); });
function openNavigator() {
  const b = openSheet('Navigateur');
  const p = document.createElement('p'); p.className = 'muted'; p.textContent = 'Choisis une pièce à visiter.'; b.appendChild(p);
  const list = document.createElement('div'); list.className = 'rooms'; b.appendChild(list);
  for (const id of ['hall','cafe','roof','home']) { const r = ROOMS[id], here = R && R.id === id, n = here ? R.ents.length : r.bots + (id === 'home' ? 0 : 1);
    const btn = document.createElement('button'); btn.className = 'room';
    btn.innerHTML = `<i class="dot" style="background:${r.dot}"></i><div><b></b><span></span></div><em class="${n ? '' : 'empty'}">${here ? 'Ici' : n + ' ' + (n > 1 ? 'pers.' : 'pers.')}</em>`;
    btn.querySelector('b').textContent = r.name; btn.querySelector('span').textContent = r.desc;
    btn.onclick = () => { closeSheet(); if (!here) enterRoom(id); }; list.appendChild(btn); }
}
function openCatalogue(tab = 'Sièges', sel = null) {
  const b = openSheet('Catalogue');
  const tabs = document.createElement('div'); tabs.className = 'tabs'; b.appendChild(tabs);
  for (const t of CAT_TABS) { const x = document.createElement('button'); x.className = 'hbtn'; x.textContent = t; x.setAttribute('aria-pressed', String(t === tab)); x.onclick = () => openCatalogue(t); tabs.appendChild(x); }
  const ids = Object.keys(F).filter(k => F[k].cat === tab); sel = sel || ids[0];
  const f = F[sel], det = document.createElement('div'); det.className = 'detail';
  det.innerHTML = `<img alt=""><div><b></b><p></p><button class="hbtn go">Acheter</button></div>`;
  det.querySelector('img').src = thumb(sel); det.querySelector('b').textContent = f.name;
  det.querySelector('p').textContent = `${f.price} crédits · ${f.w}×${f.d} case${f.w*f.d > 1 ? 's' : ''}${S.inv[sel] ? ' · ' + S.inv[sel] + ' dans ton inventaire' : ''}`;
  const buy = det.querySelector('button'); buy.textContent = `Acheter (${f.price} crédits)`; buy.disabled = S.credits < f.price;
  buy.onclick = () => { if (S.credits < f.price) return; S.credits -= f.price; S.inv[sel] = (S.inv[sel] || 0) + 1; renderCredits(); save();
    toast(`${f.name} ajouté à ton inventaire !`, 'good'); openCatalogue(tab, sel); };
  b.appendChild(det);
  if (S.credits < f.price) { const p = document.createElement('p'); p.className = 'muted'; p.textContent = 'Pas assez de crédits : reste connecté·e pour gagner 10 crédits toutes les 3 minutes.'; b.appendChild(p); }
  const grid = document.createElement('div'); grid.className = 'grid'; b.appendChild(grid);
  for (const id of ids) { const c = document.createElement('button'); c.className = 'card'; c.setAttribute('aria-pressed', String(id === sel));
    c.innerHTML = `<img alt=""><b></b><small><img alt="" src="${ICON_URL.money}">${F[id].price}</small>`; c.querySelector('img').src = thumb(id); c.querySelector('b').textContent = F[id].name;
    c.onclick = () => openCatalogue(tab, id); grid.appendChild(c); }
}
function openInventory() {
  const b = openSheet('Inventaire');
  const ids = Object.keys(S.inv).filter(k => S.inv[k] > 0);
  if (!ids.length) { const p = document.createElement('p'); p.className = 'muted'; p.textContent = 'Ton inventaire est vide. Achète des mobis dans le Catalogue, ou range ceux de ton appart.'; b.appendChild(p);
    const go = document.createElement('button'); go.className = 'hbtn go big'; go.textContent = 'Ouvrir le Catalogue'; go.onclick = () => openCatalogue(); b.appendChild(go); return; }
  const p = document.createElement('p'); p.className = 'muted'; p.textContent = 'Touche un mobi pour le poser dans ton appart.'; b.appendChild(p);
  const grid = document.createElement('div'); grid.className = 'grid'; b.appendChild(grid);
  for (const id of ids) { const c = document.createElement('button'); c.className = 'card';
    c.innerHTML = `<img alt=""><b></b><small>×${S.inv[id]}</small>`; c.querySelector('img').src = thumb(id); c.querySelector('b').textContent = F[id].name;
    c.onclick = () => startPlace(id, null); grid.appendChild(c); }
}
let pick = null;
function lookEditor(body, look, onChange) {
  const maker = document.createElement('div'); maker.className = 'maker';
  maker.innerHTML = `<div class="previewbox"><canvas width="22" height="46"></canvas></div><div class="fields"></div>`;
  body.appendChild(maker);
  const cvp = maker.querySelector('canvas'), fields = maker.querySelector('.fields');
  const draw = () => { const x = cvp.getContext('2d'); x.clearRect(0, 0, 22, 46); x.drawImage(avatarSet(look).get('front','stand','wave'), 0, 0); onChange && onChange(); };
  const seg = (label, opts, key) => { const d = document.createElement('div'); d.className = 'lbl'; d.textContent = label; const s = document.createElement('div'); s.className = 'seg'; d.appendChild(s);
    const paint = () => { s.innerHTML = ''; opts.forEach((o, i) => { const b = document.createElement('button'); b.className = 'hbtn'; b.textContent = o; b.setAttribute('aria-pressed', String(look[key] === i)); b.onclick = () => { look[key] = i; paint(); draw(); }; s.appendChild(b); }); };
    paint(); fields.appendChild(d); };
  const sw = (label, list, key) => { const d = document.createElement('div'); d.className = 'lbl'; d.textContent = label; const s = document.createElement('div'); s.className = 'sw'; d.appendChild(s);
    const paint = () => { s.innerHTML = ''; list.forEach((c, i) => { const b = document.createElement('button'); b.style.background = c[0]; b.setAttribute('aria-label', label + ' ' + (i+1)); b.setAttribute('aria-pressed', String(look[key] === i)); b.onclick = () => { look[key] = i; paint(); draw(); }; s.appendChild(b); }); };
    paint(); fields.appendChild(d); };
  seg('Coiffure', STYLES, 'style'); sw('Cheveux', HAIRS, 'hair'); sw('Peau', SKINS, 'skin'); sw('Haut', SHIRTS, 'shirt'); sw('Pantalon', PANTS, 'pants');
  draw();
}
function openWardrobe() {
  const b = openSheet('Garde-robe'); const look = Object.assign({}, S.look);
  lookEditor(b, look);
  const lm = document.createElement('label'); lm.className = 'muted'; lm.style.display = 'flex'; lm.style.flexDirection = 'column'; lm.style.gap = '3px'; lm.textContent = 'Devise';
  const inp = document.createElement('input'); inp.className = 'txt'; inp.maxLength = 40; inp.value = S.motto; lm.appendChild(inp); b.appendChild(lm);
  const ok = document.createElement('button'); ok.className = 'hbtn go big'; ok.textContent = 'Enregistrer mon look'; b.appendChild(ok);
  ok.onclick = () => { S.look = look; S.motto = inp.value.trim() || S.motto; R.me.look = look; R.me.av = avatarSet(look); R.me.motto = S.motto; save(); closeSheet(); R.me.wave = 2;
    if (R.ents.some(e => e.bot)) setTimeout(() => { const bt = R.ents.find(e => e.bot); if (bt) say(bt, pickRand(['Trop stylé ton nouveau look !','Oh, ça te va bien !'])); }, 900); };
}
function openWelcome() {
  const b = openSheet('Bienvenue'); $('sheetClose').hidden = true;
  const saved = loadSave();
  b.insertAdjacentHTML('beforeend', `<h1 class="logo">Pixel <i>Hôtel</i></h1><p class="tag">Un hôtel en pixels, rien que pour toi. Crée ton perso et entre !</p>`);
  const look = saved ? Object.assign({}, saved.look) : {style:0, hair:0, skin:0, shirt:2, pants:0};
  const nameL = document.createElement('label'); nameL.className = 'muted'; nameL.style.display = 'flex'; nameL.style.flexDirection = 'column'; nameL.style.gap = '3px'; nameL.textContent = 'Pseudo';
  const nameI = document.createElement('input'); nameI.className = 'txt'; nameI.maxLength = 14; nameI.value = saved ? saved.name : 'Pixelou'; nameL.appendChild(nameI);
  b.appendChild(nameL); lookEditor(b, look);
  if (saved) { const c = document.createElement('button'); c.className = 'hbtn go big'; c.textContent = `Continuer en tant que ${saved.name}`; c.onclick = () => { $('sheetClose').hidden = false; closeSheet(); boot(saved); }; b.appendChild(c); }
  const n = document.createElement('button'); n.className = 'hbtn big' + (saved ? '' : ' go'); n.textContent = saved ? 'Nouveau perso' : 'Entrer dans l\'hôtel'; b.appendChild(n);
  let armed = false;
  n.onclick = () => { if (saved && !armed) { armed = true; n.textContent = 'Effacer l\'ancien perso ?'; n.classList.add('warn'); return; }
    const name = nameI.value.trim().slice(0, 14) || 'Pixelou'; $('sheetClose').hidden = false; closeSheet(); boot(newProfile(name, look, 'Nouveau·elle à l\'hôtel !')); };
  b.insertAdjacentHTML('beforeend', `<ul class="help"><li><b>Touche le sol</b> pour marcher, <b>un mobi</b> pour t'asseoir ou l'utiliser.</li><li><b>Écris dans le chat</b> : les autres te répondent.</li><li><b>Navigateur</b> pour changer de pièce, <b>Catalogue</b> pour acheter des mobis.</li><li>Décore <b>ton appart</b> : déplace, tourne et range tes mobis.</li></ul>`);
}
$('tNav').onclick = () => openNavigator();
$('tCat').onclick = () => openCatalogue();
$('tInv').onclick = () => openInventory();
$('tWar').onclick = () => openWardrobe();
$('tDance').onclick = () => { if (!R) return; dancingMe = !dancingMe; R.me.pose = null; syncDance(); };
$('tWave').onclick = () => { if (!R) return; R.me.wave = 2; };
$('chatForm').addEventListener('submit', ev => {
  ev.preventDefault(); if (!R) return; const inp = $('chatInput'), text = inp.value.trim(); if (!text) return; inp.value = '';
  const low = norm(text);
  if (low === ':danse' || low === '/danse') { dancingMe = true; R.me.pose = null; syncDance(); return; }
  if (low === ':coucou' || low === '/coucou') { R.me.wave = 2; return; }
  say(R.me, text); botReply(text);
});

/* ================= Boot & loop ================= */
function boot(profile) {
  S = profile;
  const today = new Date().toISOString().slice(0, 10);
  if (S.lastDaily !== today) { const first = !S.lastDaily; S.lastDaily = today; if (!first) { S.credits += 50; setTimeout(() => toast('Bonus du jour : +50 crédits !', 'good'), 800); } }
  renderCredits(); enterRoom(S.room === 'home' ? 'home' : (ROOMS[S.room] ? S.room : 'hall'), false);
  save();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
let last = performance.now(), followT = 0;
function frame(now) {
  const dt = Math.min(.1, (now - last)/1000); last = now;
  if (R && S) { update(dt); followT -= dt; if (followT < 0 && R.me.moving) { followT = .4; const [sx] = P(R.me.x, R.me.y), x = world.offsetLeft + sx*scale - stage.scrollLeft;
    if (x < stage.clientWidth*.22 || x > stage.clientWidth*.78) centerOn(R.me, true); } }
  render(now/1000);
  requestAnimationFrame(frame);
}
function start(data) {
  const st = data && data.state;
  if (st && st.v === 1) boot(st); else openWelcome();
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => (S ? {state:S} : {}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
